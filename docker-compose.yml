# Secrets (HIVEMEM_DB_PASSWORD, SEAWEEDFS_S3_ACCESS_KEY, SEAWEEDFS_S3_SECRET_KEY)
# have no committed defaults — set them in a .env file next to this compose file
# (gitignored) or in the environment. The SeaweedFS credentials must match
# seaweedfs/s3.json (create it from seaweedfs/s3.json.template).
#
# Resource limits are conservative single-host defaults — tune per host.
services:
  hivemem-db:
    image: pgvector/pgvector:pg17
    container_name: hivemem-db
    environment:
      POSTGRES_DB: hivemem
      POSTGRES_USER: hivemem
      POSTGRES_PASSWORD: ${HIVEMEM_DB_PASSWORD:?set HIVEMEM_DB_PASSWORD in .env}
    volumes:
      - hivemem-pgdata:/var/lib/postgresql/data
    networks:
      - hivemem-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivemem -d hivemem"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    # Proxmox LXC: uncomment the next line
    # security_opt: [apparmor=unconfined]

  hivemem-embeddings:
    image: ghcr.io/visterion/hivemem-embeddings:main
    container_name: hivemem-embeddings
    environment:
      EMBEDDING_BACKEND: ${HIVEMEM_EMBEDDING_BACKEND:-onnx}
      OLLAMA_URL: http://hivemem-ollama:11434
      OLLAMA_MODEL: ${HIVEMEM_OLLAMA_MODEL:-qwen3-embedding:8b-q8_0}
      EMBEDDING_DIMS: "1024"
      EMBEDDING_MAX_TOKENS: "2560"
      EMBEDDING_KEEP_ALIVE: "5m"
      EMBEDDING_MAX_CHARS: "8000"
    # --- LARGE ONNX/CPU MODEL (e.g. Snowflake/snowflake-arctic-embed-l-v2.0) ---
    # Uncomment to run a large model on CPU instead of the small built-in default
    # (paraphrase-multilingual-MiniLM-L12-v2, 128 tokens, fits mem_limit: 2g below).
    # A large model needs a MUCH bigger memory budget — see mem_limit note below,
    # this is not optional headroom, the container gets OOM-killed without it.
    #
    #   MODEL_REPO: Snowflake/snowflake-arctic-embed-l-v2.0
    #   ONNX_FILE: onnx/model_quantized.onnx
    #   POOLING: cls
    #   # arctic-embed v2.0 is trained asymmetrically: queries carry a prefix,
    #   # documents do not (see the model card). Omitting it measurably degrades
    #   # retrieval. This affects only the query side, so it is NOT part of the
    #   # embedding identity string and can be changed later without a re-encode
    #   # — unlike DOCUMENT_PREFIX, which is part of the identity.
    #   QUERY_PREFIX: "query: "
    #   MAX_LENGTH: "8192"
    #   EMBEDDING_MAX_CHARS: "50000"
    #   # Set this explicitly to the container's actual cpus: below. Left unset,
    #   # onnxruntime falls back to the cgroup CPU quota and, failing that, to
    #   # os.cpu_count() — which reads the *host's* core count and can be wildly
    #   # wrong inside a limited container (measured 12 vs. an actual 2-core
    #   # quota on one host: a 6x oversubscription).
    #   ORT_INTRA_OP_THREADS: "6"
    #
    # REQUIRED with the above: mem_limit/cpus sized for the model, not the
    # defaults below. onnxruntime's arena allocator grows to fit the longest
    # sequence it has processed and never releases the memory — it is a
    # high-water mark, not a working set. A single-request benchmark will not
    # reveal this: latency and peak memory look fine one request at a time and
    # only climb under a sustained sequence of long inputs. Measured with
    # arctic-embed-l-v2.0 at MAX_LENGTH=8192: a sustained run of 40 real cells
    # climbed 8.675 -> 9.975 -> 10.000 GiB and then sat pinned at a 10g limit,
    # so the next allocation OOM-killed the container (which took the
    # depending `hivemem` service down with it and restarted an in-progress
    # corpus re-encode from scratch). With headroom the same workload
    # plateaus at 10.79 GiB. Budget accordingly — e.g. mem_limit: 14g, cpus: 6.
    # --- END LARGE ONNX/CPU MODEL ---
    volumes:
      - hivemem-embeddings-models:/app/models
    networks:
      - hivemem-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      # First boot downloads the model from Hugging Face — allow plenty of time.
      start_period: 300s
    # Sized for the small built-in default model (paraphrase-multilingual-MiniLM-L12-v2,
    # 128 tokens). A large model (see the commented block above) needs far more —
    # do not raise MAX_LENGTH/swap MODEL_REPO without also raising mem_limit/cpus.
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    # Proxmox LXC: uncomment the next line
    # security_opt: [apparmor=unconfined]

  hivemem-ollama:
    profiles: [gpu]
    image: ollama/ollama:rocm
    container_name: hivemem-ollama
    devices: ["/dev/kfd", "/dev/dri"]
    group_add: ["993"]              # host GID of `render`; a name resolves inside the container
    security_opt: ["seccomp=unconfined"]
    volumes: [hivemem-ollama-models:/root/.ollama]
    networks:
      - hivemem-net
    healthcheck:
      # The image ships neither curl nor wget; only /usr/bin/ollama is available.
      # `ollama list` errors with non-zero exit until the daemon answers, providing
      # liveness semantics without embedding to refresh keep_alive or defeat idle unload.
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 12g
    cpus: 4
    environment:
      OLLAMA_KEEP_ALIVE: 5m
    restart: unless-stopped

  hivemem:
    image: ghcr.io/visterion/hivemem:main
    container_name: hivemem
    ports:
      - "8421:8421"
    environment:
      HIVEMEM_JDBC_URL: jdbc:postgresql://hivemem-db:5432/hivemem
      HIVEMEM_DB_USER: hivemem
      HIVEMEM_DB_PASSWORD: ${HIVEMEM_DB_PASSWORD:?set HIVEMEM_DB_PASSWORD in .env}
      HIVEMEM_EMBEDDING_URL: http://hivemem-embeddings:80
      # Pairing, not two independent knobs: during a model-change re-encode, raise the timeout
      # above the slowest single cell and disable retries for the window, or a retry just
      # multiplies an already-slow call into concurrent inferences the sidecar can't cancel.
      # See the "Embedding re-encode migration window" section in documentation/architecture.md.
      HIVEMEM_EMBEDDING_TIMEOUT: ${HIVEMEM_EMBEDDING_TIMEOUT:-PT30S}
      HIVEMEM_EMBEDDING_MAX_RETRIES: ${HIVEMEM_EMBEDDING_MAX_RETRIES:-3}
      HIVEMEM_EMBEDDING_RETRY_BACKOFF_MS: ${HIVEMEM_EMBEDDING_RETRY_BACKOFF_MS:-500}
      HIVEMEM_ATTACHMENT_ENABLED: "true"
      SEAWEEDFS_S3_ENDPOINT: http://seaweedfs:8333
      SEAWEEDFS_S3_BUCKET: hivemem-attachments
      SEAWEEDFS_S3_ACCESS_KEY: ${SEAWEEDFS_S3_ACCESS_KEY:?set SEAWEEDFS_S3_ACCESS_KEY in .env}
      SEAWEEDFS_S3_SECRET_KEY: ${SEAWEEDFS_S3_SECRET_KEY:?set SEAWEEDFS_S3_SECRET_KEY in .env}
      # Session cookie defaults to Secure (HTTPS-only). For plain-HTTP local
      # setups uncomment the override:
      # SESSION_COOKIE_SECURE: "false"
    depends_on:
      hivemem-db:
        condition: service_healthy
      hivemem-embeddings:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - hivemem-net
    mem_limit: 3g
    cpus: 2
    restart: unless-stopped
    # Proxmox LXC: uncomment the next line
    # security_opt: [apparmor=unconfined]

  seaweedfs:
    image: chrislusf/seaweedfs:3.68
    command: >
      server
      -s3
      -s3.config=/etc/seaweedfs/s3.json
      -dir=/data
    volumes:
      - seaweedfs_data:/data
      # Create from seaweedfs/s3.json.template — the real file is gitignored.
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    # No published ports: only hivemem talks to the S3 API, over hivemem-net.
    # For ad-hoc host access use `docker exec` or a temporary `-p 8333:8333`.
    networks:
      - hivemem-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped
    # Proxmox LXC: uncomment the next line
    # security_opt: [apparmor=unconfined]

networks:
  hivemem-net:

volumes:
  hivemem-pgdata:
  hivemem-embeddings-models:
  hivemem-ollama-models:
  seaweedfs_data:
