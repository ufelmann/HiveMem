name: cli

on:
  push:
    paths: ['cli/**', '.github/workflows/cli.yml']
  pull_request:
    paths: ['cli/**', '.github/workflows/cli.yml']
  release:
    types: [published]

jobs:
  test:
    # Both platforms: without a Windows runner the DPAPI path never executes.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          # Taken from go.mod so the two can never drift: go.mod requires
          # 1.25.0, which a pinned 1.23 toolchain cannot build at all.
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Vet
        run: go vet ./...

      # -skip TestCLIEndToEnd is paired with the dedicated "End-to-end (built
      # binary)" step below: HIVEMEM_CLI_E2E is unset here, and TestCLIEndToEnd
      # hard-fails (rather than skipping) whenever CI is set but
      # HIVEMEM_CLI_E2E is not — which GitHub Actions makes true for every
      # step on every platform. If the dedicated e2e step is ever removed,
      # this -skip must be removed too, or the suite silently stops running
      # anywhere in CI.
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: go test ./... -race -count=1 -skip TestCLIEndToEnd

      - name: Install D-Bus tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-x11

      # See the -skip note on "Test (Windows)" above: same pairing applies here.
      - name: Test (Linux, no session bus)
        if: runner.os == 'Linux'
        env:
          DBUS_SESSION_BUS_ADDRESS: ''
        run: go test ./... -race -count=1 -skip TestCLIEndToEnd

      # NOTE: this does NOT cover the Secret Service round trip, and that is
      # intentional. gnome-keyring is deliberately NOT installed here: its
      # package registers a D-Bus service-activation file, so merely running
      # under `dbus-run-session` auto-starts it — and its "login" collection
      # can never be bootstrapped non-interactively from an empty home
      # directory (`gnome-keyring-daemon --unlock` only unlocks a keyring file
      # that already exists; creating one over D-Bus requires a Prompt round
      # trip tied to an interactive secret prompter this runner does not
      # have). Verified by hand (2026-08-09): with the daemon installed and
      # auto-activated, TestSecretServiceRoundTrip does NOT skip — it FAILS
      # with "Object does not exist at path .../collection/login" because the
      # default collection alias never resolves. Only with no secrets
      # provider registered at all does platformKeyring() correctly report
      # "unavailable" and the test SKIPs, which is what this step now proves.
      # TestSecretServiceRoundTrip must be exercised manually on a real
      # desktop session before releasing a change to secretservice_linux.go.
      - name: Test (Linux, with session bus, no Secret Service)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- go test ./internal/keystore/ -race -count=1 -run TestSecretService -v

      # Paired with the -skip TestCLIEndToEnd flags added to the two broad
      # steps above: this is the only step that actually runs TestCLIEndToEnd
      # in CI. Do not remove this step without also removing those -skip
      # flags, or TestCLIEndToEnd stops running anywhere in CI while its own
      # guard (see e2e_test.go) still merely hard-fails the broad steps
      # instead of ever being exercised.
      - name: End-to-end (built binary)
        env:
          HIVEMEM_CLI_E2E: "1"
        run: go test ./internal/e2e/... -run TestCLIEndToEnd -v -count=1

  build:
    needs: test
    runs-on: ubuntu-latest
    # Attaching binaries to a release is a write to repository contents. The
    # default token is read-only here, and without this the release event's
    # run fails at "Attach to release" with "Resource not accessible by
    # integration" — after every other step has passed, so the run looks
    # healthy right up to the point that produces the artifacts. Observed on
    # v9.38.0.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          # Taken from go.mod so the two can never drift: go.mod requires
          # 1.25.0, which a pinned 1.23 toolchain cannot build at all.
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Cross-compile
        run: make build-all
      - uses: actions/upload-artifact@v7
        with:
          name: hivemem-cli
          path: cli/bin/*
      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: cli/bin/*
